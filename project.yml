name: NewbornMoments
options:
  bundleIdPrefix: com
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.4.0

targets:
  NewbornMoments:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    scheme: {}
    sources:
      - path: NewbornMoments/Sources
      - path: NewbornMoments/Resources/Assets.xcassets
        buildPhase: resources
      - path: NewbornMoments/Resources/Fonts
        buildPhase: resources
      - path: NewbornMoments/Resources/GoogleService-Info.plist
        buildPhase: resources
      - path: NewbornMoments/Resources/loader.json
        buildPhase: resources
      - path: NewbornMoments/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: NewbornMoments/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.BabyCollages
        PRODUCT_NAME: NewbornMoments
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "X4R77QQ25M"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: RevenueCat
        product: RevenueCat
      - package: Lottie
        product: Lottie
